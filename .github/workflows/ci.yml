name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Use the stable toolchain
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Use the stable toolchain
        run: rustup default stable
      - name: Show versions
        run: |
          rustc --version
          cargo --version
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release binary
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --locked

  # The oldest Rust version the project says it supports. This fails when a
  # change, or a dependency update, needs something newer. The version here must
  # match `rust-version` in Cargo.toml.
  minimum-rust:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.87.0
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Use Rust 1.87.0
        run: rustup default 1.87.0
      - name: Show versions
        run: |
          rustc --version
          cargo --version
      - name: Test
        run: cargo test --workspace --locked

  replay-offline:
    name: Replay dry run (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install replay dependencies without scripts
        working-directory: tools/replay
        run: npm ci --ignore-scripts
      - name: Check Node dependencies
        working-directory: tools/replay
        run: npm audit --omit=dev
      - name: Test replay-only follow-up format and classification
        working-directory: tools/replay
        run: npm test
      - name: Build replay fixtures without network requests
        working-directory: tools/replay
        run: node replay.mjs --dry-run > "$RUNNER_TEMP/replay-dry-run.json"
