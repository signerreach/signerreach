name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signerreach-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  book:
    name: Book build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation source links
        run: python3 tools/docs/check_book.py book --source-only

      - name: Download and verify mdBook 0.5.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/mdbook.tar.gz" \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP" mdbook
          "$RUNNER_TEMP/mdbook" --version
          "$RUNNER_TEMP/mdbook" build book

      - name: Validate generated book and links
        run: python3 tools/docs/check_book.py book

      # Never upload Pages artifacts from pull requests or non-main refs.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.SIGNERREACH_PAGES_ENABLED == 'true'))
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: book/site

  deploy:
    name: Docs deploy
    needs: book
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.SIGNERREACH_PAGES_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy book to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
